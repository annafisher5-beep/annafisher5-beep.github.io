<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PalettePlanet OFFICIAL webpage</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f7faf5;--card:#fff;--tx:#1f2a22;--mut:#5d6b61;--bd:#dfe7dc;--r:#d64545;--g:#2f9e5b;--b:#2f6fd6;--p:#7b4fc9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141a16;--card:#1d2620;--tx:#e8f0ea;--mut:#9fb0a4;--bd:#2c3a30;--r:#ef7070;--g:#4fc080;--b:#6fa0f0;--p:#a98af0}}
*{box-sizing:border-box}html{color-scheme:light dark}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:auto;padding:16px}
header{text-align:center;padding:12px 0}h1{margin:4px 0;font-size:28px}.sub{color:var(--mut);margin:0 0 12px}
input{width:100%;padding:12px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.tile{border:0;border-radius:16px;padding:18px 10px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;text-align:center}
.tile small{display:block;font-weight:400;opacity:.9}
.list a,.item{display:block;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--c);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.item b{display:block}.item span{color:var(--mut);font-size:14px}
.back{background:none;border:0;color:var(--tx);font-size:16px;cursor:pointer;padding:8px 0}
.pill{display:inline-block;color:#fff;border-radius:99px;padding:2px 10px;font-size:13px;margin-right:6px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px 16px 12px;margin:12px 0}
h2{font-size:18px;margin:14px 0 4px}li{margin:3px 0}.warn{background:#fff3cd;color:#5c4400;border-radius:10px;padding:8px 12px;margin:10px 0}
.btn{display:inline-block;background:var(--c);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:15px;cursor:pointer;text-decoration:none;margin:4px 6px 4px 0}
.pic{display:block;max-width:100%;max-height:360px;margin:12px auto;border-radius:14px;border:3px solid var(--c);object-fit:contain;background:#fff}
.about{color:var(--mut);font-size:14px;text-align:center;margin-top:24px}
</style></head><body><main id="app"></main>

['spoon','Cutlery Butterfly','ac12','https://www.youtube.com/watch?v=O4mHOqckWqo','','Wooden or plastic cutlery (spoon or knife)|Paper|Pipe cleaners|Googly eyes|Markers (optional)','Lay your materials on a flat surface|Draw a love heart on paper, the size of your cutlery|Cut out the heart|Fold it in half and cut down the line to make two wings|Draw a face on the head of the spoon/fork, or use googly eyes|Stick the wings on either side of the handle|Cut 2 pieces of pipe cleaner (3 cm) and stick them on top as antennae|Decorate however you want!'],
['lion','Paper-Plate Lion Mask','ac12','https://www.youtube.com/watch?v=B0zB1mDwq8Q','','Paper plate (one per child)|Yellow and orange paint|Paintbrush|Black marker|White paper (for eyes)|Glue stick|Scissors (adult help needed)|Elastic string and hole punch (for mask version)','Cut small triangles from the outer circle of the plate to make a mane|Paint the centre yellow (face) and the outer edge orange (mane); dry 10–15 min|Paint or draw a downward orange triangle nose|Draw a black mouth under the nose, plus whiskers and dots|Paint two orange cheeks|Add eyelashes, eyebrows or extra fur with the marker|Mask: an adult cuts two eye holes in the yellow centre|Punch a hole each side and tie/glue elastic through them|Try it on: you’re a roaring lion! 🦁|Optional: glitter on the mane; make a lion family with different plate sizes'],
['tpanimal','Toilet Roll Animal','ac12','https://youtu.be/EwilruOET0s?si=BFx-r-ATN5Y5o62v','','4 empty toilet paper rolls|Glue|Sticky tape|Scissors|Markers or paint|Googly eyes|Paper','Gather materials on a flat surface|Brown roll? Wrap paper around it and colour it like your animal. White roll? Draw straight on it. This is the body|Cut a second roll in half horizontally|Cut one half vertically all the way up, then roll to your desired neck thickness and tape it. Colour the neck in your animal’s pattern|Colour the other half: this is the head|Draw a circle on paper, colour it as a nose and cut it out. Tape it to the front of the head|Draw, colour and cut little ears; stick them on top of the head|Glue the head to the neck, then the neck and head to the body|Legs: cut a new roll in half horizontally, cut one side of each half vertically, roll, tape and colour. Make 4 legs and stick them to the bottom of the body|Mane: cut a 1.5 cm × 5 cm rectangle, colour it, fold in half, cut halfway up the fold for texture, and stick it on the neck|Tail: repeat the mane, then roll it and tape it to the back|Hurray! (Or make an easier version like the video)'],
['cork','Cork Butterfly','ac12','https://youtu.be/TxrJfBzl384?si=icFr-t17vT9Wiuve','','Wine corks (one per butterfly)|Coloured paper (wings)|Googly eyes (two each)|Glue|Scissors (adult help needed)|Markers or paint (optional)','Optional: paint each cork and let it dry 10 min|Fold coloured paper in half; draw a big heart with the point on the fold|Cut it out: open it for two joined wings|Glue a line down the middle of the wings and press the cork on top; hold 10 seconds|Glue two googly eyes near the top of the cork; wait a minute|Decorate the body with lines, dots, swirls or a smile|Let dry 15–20 minutes|Optional: glitter on wings; glue butterflies on green paper with flowers for a garden display'],
['frog','Cardboard-Tube Frog','ac12','https://youtu.be/WosGNLvs_Gc?si=jkhj5-AaXsSIU0h2','','Cardboard tube (toilet paper roll)|Green paint or paper|White paper (eyes)|Black marker or paper (pupils)|Red paper (tongue)|Glue or tape|Scissors','Paint the tube green; let it dry|Cut two big white circles for eyes|Draw black dots in the middle of each eye|Glue the eyes on top of the tube|Cut a small red rectangle tongue; glue under the eyes|Draw a smile|Cut two long green strips for legs; glue to the sides|Cut small leaf-shaped feet and glue at the bottom'],
['dragonfly','Peg Dragonflies','ac12','https://www.google.com/search?q=dragonfly+peg+craft+easy&client=safari&hs=A6UB&sca_esv=fa81187b3ec342aa&hl=en-au&sxsrf=APpeQnvdye1kZlRXtnCgnQeczhL0m1h6bQ%3A1792287685899&ei=xSPUapHANrPirfcPxLm_6A8&biw=820&bih=1048&uact=5&oq=dragonfly+peg+craft+easy&gs_lp=Egxnd3Mtd2l6LXNlcnAiGGRyYWdvbmZseSBwZWcgY3JhZnQgZWFzeTIFECEYoAEyBRAhGJ8FMgUQIRifBTIFECEYnwVI9xJQoAdYww9wAXgBkAEAmAHRAaAB6QeqAQUwLjIuM7ABALgBA8gBAPgBAZgCBqACtQjCAgoQABhHGNYEGLADwgIGEAAYFhgewgILEAAYgAQYigUYhgPCAgUQABjvBcICBxAhGAoYoAHCAgQQIRgVmAMA4gMEGAAgXeIDBBgAIF7iAwQYACBf4gMEGAAgYOIDBBgAIGHiAwQYACBiiAYBkAYEkgcFMS4wLjWgB6cUsgcDMi01uAeuCMIHBTItNS4xyAcmgAgB&sclient=gws-wiz-serp#fpstate=ive&vld=cid:07d5da10,vid:rkZ-5SpbgEk,st:0','p','Wooden clothes pegs|Child-safe, washable paint and paintbrushes|Coloured paper or card for the wings|Child-safe glue|Crayons or markers for decorating','PAINT THE PEG 🎨 Choose your favourite colour and paint the wooden peg. Leave it to dry|MAKE THE PAPER WINGS 🪽 An adult cuts out four wing shapes from coloured paper. Children can decorate them with crayons or dots of paint|ATTACH THE WINGS With an adult’s help, glue the paper wings onto the peg. Let the glue dry|ADD A FACE 😊 Draw two eyes and a little smile on the front of the peg|LET’S FLY! 🌼 Hold your dragonfly and pretend it is flying through a garden. Flap your arms like dragonfly wings!'],
['pots','Animal Plant Pots','ac36','https://youtu.be/IOb0R7tObD0?si=uE4UUL1CiG6SwVNb','p','Empty plastic bottles (one per animal)|Scissors (adult help needed)|Pink, white and green paint|Paintbrushes|Black marker|Potting soil|Small plants or seeds|Glue (optional)','Cut the bottle top off with adult help|Shape the ears: pig and frog short, bunny tall|Paint: pink pig 🐷, white bunny 🐰, green frog 🐸; dry completely|Draw faces with black marker: eyes, nose, mouth, whiskers or tongue|Add soil|Plant seeds or small plants and water gently'],
['bflower','Bottle Flowers','ac36','https://youtu.be/mCwAZAeGycM?si=etG7wRWhlNgM93jL','p','Empty plastic bottles (one per flower)|Scissors (adult help needed)|Paint: blue, purple, yellow or favourites|Paintbrushes|Pom-poms (centres)|Drinking straws (stems)|Green paper (leaves)|Glue or tape|Small vase or cup','Adult cuts the bottom off the bottle: this is the flower shape|Paint it in bright colours; let dry|Glue a pom-pom in the middle|Attach a straw to the back as the stem|Cut green paper leaves and glue to the straw|Display in a vase or cup'],
['organiser','Cardboard Box Desk Organiser','ac36','https://youtu.be/Ene8C3R_YBE?si=L1nbDwrbesdnTBn','p','Small cardboard boxes (tissue or snack boxes)|Empty toilet paper rolls (pencil holders)|Glue or tape|Scissors (adult help needed)|Coloured or wrapping paper scraps|Markers or stickers','Gather small boxes and toilet rolls; make sure they’re clean and dry|Trim boxes to different heights: one tall for books, one short for pencils|Arrange boxes side by side and glue into one big organiser|Glue toilet rolls upright inside one section for pens and markers|Cover with coloured or reused wrapping paper; add drawings, stickers or labels|Fill with books, pencils, markers and notes|Show it off and talk about how reusing boxes reduces waste'],
['lantern','Fairy House Lantern','ac36','https://www.youtube.com/watch?v=rToLsZ2M1-Y','p','Two empty plastic bottles (same size, clean, dry)|Safety scissors (adult use only)|Non-toxic paint: blue, green, brown|Paintbrushes (one wide, one thin)|Glue|Markers|Artificial flowers|Paper leaves|Battery tea light','BOTTLE 1: place it so it can’t roll. Adult holds it and cuts a rectangle window in the front, trims edges smooth. Child brushes away tiny plastic bits|BOTTLE 2: lay sideways. Adult cuts straight across the middle and removes the top half: this is the roof. Adult checks the edge isn’t sharp|PAINT BASE: wide brush, blue paint, long strokes from the bottom up, all sides except the window; thin brush around the window. Stand upright to dry 10–15 min|PAINT ROOF: whole roof green with the wide brush; dark green tile lines with the thin brush; paint the bottle cap brown as a chimney. Dry upside-down|ATTACH ROOF: adult squeezes glue round the rim of the blue bottle; child presses the roof on like a hat for 30 seconds; check it doesn’t wobble|DECORATE: dot of glue under each flower; press around the window and bottom edge; glue leaves round roof and chimney. Draw a door, tiny bricks, a round roof window and climbing vines|LIGHT: switch on the battery tea light and gently place it in the window so it sits flat|FINISH: glue a few flowers round the chimney and one leaf sticking up on the roof; press each 5 seconds|Optional: glitter roof; paint a village of different-coloured houses; paper butterflies on the roof'],
['robot','Recycled Robot','ac36','https://www.youtube.com/watch?v=bd3ew5Jk4eY','','Cardboard sheet (background)|Small cardboard box (head)|Plastic bottle caps (eyes)|Clear plastic cups (eye lenses)|Buttons (nose, cheeks, body)|Small funnel (hat)|Cupcake liners (shoulders)|Plastic forks (arms)|Green craft sticks|Black rectangular cardboard (body)|Aluminium foil (skirt)|Yellow plastic tubes (legs)|Small colourful objects (buttons, dice, beads)|Glue|Scissors (adult help needed)','Lay the cardboard sheet flat; make sure it fits the whole robot|HEAD: glue the box near the top. Glue two bottle caps on the front for eyes and clear cups over them as lenses. Two pink buttons for cheeks, a small rectangle mouth, and the funnel upside down as a hat|BODY: glue the black cardboard under the head; decorate the chest with buttons, beads and objects; a green oval button in the centre, a pink button and blue cube below|SHOULDERS/ARMS: a cupcake liner each side of the body top; a plastic fork under each as arms; a green craft stick beside each fork; a button on each fork end for hands|SKIRT/LEGS: cut foil into a half-circle, crinkle and glue under the body; glue two yellow tubes under the foil|Draw lines or dots for robot details; check everything is glued; dry 15–20 min|Optional: googly eyes instead of caps; coloured foil outfit; name your robot on the cardboard'],
['pflower','Plastic Flower','ac36','https://www.tiktok.com/@derya.tavas/video/7667627950052887840','h','Empty plastic bottle (clear, clean, dry)|Safety scissors (adult help required)|Non-toxic paint: white, yellow or favourites|Paintbrush|Glue (optional)|Markers (optional)|Paper towel or newspaper|Small bead or button (centre)','Cover the table with newspaper or paper towel; put the bottle, scissors, paint, brush, glue and bead nearby|Adult cuts off the bottom of the bottle: it has five bumps, the petals. Wipe the cut edge. Place it upside down, bumps up|With adult help, round each bump into a petal; gently bend petals outward and curve the edges|Adult only: edges can be melted with a lighter or candle with PARENTAL GUIDANCE|Paint the inside of each petal in long smooth strokes; yellow circle in the centre for pollen; paint the outside if you like. Dry 15 min|Glue a bead or button in the middle; hold 10 seconds|Add marker lines or dots, glitter or stickers|Display on a table or glue to a stick as a stem; make several for a bouquet|Optional: rainbow bouquet; paper leaves; garden collage on cardboard; a decorative pin or hair tie'],
['stick','Stick Hanger (2 versions)','ac36','https://youtube.com/shorts/lm5LLFdxbbU?si=gDwGkAWRGF7y8cSB','p','VERSION 1 (screws): a stick, twine/string/yarn, ribbon, glue (optional), 3–6 screws, drill|VERSION 2 (no screws): a stick, twine/string/yarn, ribbon, glue (optional), paddle pop sticks','Find a nobbly bit on your stick and tie string or yarn round it in a double knot|Wrap the string along the whole stick: spread it out, make it touch, or mix colours. Optional: glue as you go|Tie a 30–50 cm string or ribbon with a double knot round each end so the stick can hang|V1: with a parent, screw a screw halfway into the stick to hang things on; repeat for more hooks|V2: place a paddle pop stick across the stick to make a plus; tie it with a square lashing knot (video link above); repeat for more hooks; tie a loop at the end to hang it on the wall|Optional fun: paint the stick and screws, add glitter'],
['bouquet','Egg Carton Bouquet','ac36','https://www.youtube.com/watch?v=dv9IILNoouQ','','Egg carton (cut into cups)|Paint: pink, yellow, orange|Paintbrush|Buttons (one per flower)|Glue|Green pipe cleaners (stems)|Ribbon (bow)|Cardboard or canvas (background)|Safety scissors (adult help needed)','Adult cuts the carton into cups; trim edges into flower shapes|Place cups on newspaper; paint bright colours; dry 10–15 min|Glue a button in the middle of each; hold 5 seconds|Glue or tape a green pipe cleaner to the back of each cup as a stem|Arrange flowers on the canvas/cardboard in a bunch; glue them down, with stems meeting at the bottom|Tie a small bow and glue it where the stems meet|Leave flat 20 min to dry|Optional: glitter petals; write your name or a message to make a gift card'],
['ocean','Egg Carton Ocean','ac36','https://www.facebook.com/TheCraftTrain/videos/make-a-tropical-reef-that-doubles-as-a-nightlight-this-is-such-a-pretty-craft-an/1040665398016783/','','Egg carton (one base)|Tissue paper: blue, pink, orange, green, purple|Pipe cleaners: white and green|Fish pictures (printed or drawn)|Glue|Safety scissors (adult help needed)|Markers (optional)','Place the clean, dry egg carton upside down: the ocean floor|Tear tissue into squares, scrunch into balls, glue one in each egg cup in bright coral colours|Twist green and white pipe cleaners into wavy seaweed/coral; glue or poke between the tissue balls|Cut out fish (adult help); glue each to a pipe cleaner and stick it in so fish “swim” above the coral|Draw bubbles or tiny shells on the carton; add tissue sea plants|Let dry 15–20 min|Optional: glitter; a mini aquarium by placing it in a box lid']
];

const lessons=[
['l-ocean','Egg Carton Ocean: “Clean Oceans”','lp12','ocean',[['What to teach',['The ocean is home to many animals','Rubbish like plastic can hurt fish and sea creatures','Recycling and reusing helps the ocean','Egg cartons can become coral instead of going in the bin']],['Teaching script',['“Fish need clean water to live.”','“Plastic in the ocean can make animals sick.”','“When we recycle, we stop rubbish going into the ocean.”','“Today we will make coral using old egg cartons to show how recycling helps sea life.”']],['Activity steps',['Show pictures of clean vs polluted oceans','Ask: “What do you see? How do you think the fish feel?”','Create the craft (steps below)','End with: “What can we recycle at home to help the ocean?”']]]],
['l-lion','Paper-Plate Lion Mask: “Saving Animal Homes!”','lp12','lion',[['What to teach',['Lions live in grasslands','Animals need safe homes with trees, plants and clean land','Recycling paper means fewer trees are cut down','Paper plates can be reused for art']],['Teaching script',['“Trees are homes for animals.”','“If we recycle paper, we save trees.”','“Today we will reuse a paper plate to make a lion mask.”']],['Activity steps',['Show a picture of a lion’s habitat','Ask: “What would happen if all the trees were gone?”','Make the craft (steps below)','End with: “What paper things can we recycle at school?”']]]],
['l-robot','Recycled Robot: “Turning Trash into Robots!”','lp12','robot',[['What to teach',['Many things we throw away can be used again','Recycling keeps rubbish out of the ground','Robots can be made from boxes, lids, foil and other reused items']],['Teaching script',['“Rubbish doesn’t disappear. It stays on Earth.”','“We can help by reusing things instead of throwing them away.”','“Today we will make a robot from recycled materials.”']],['Activity steps',['Sort materials into groups: plastic, cardboard, metal','Ask: “Which ones can we recycle?”','Build the robot (steps below)','End with: “What else could we make from recycled things?”']]]],
['l-cork','Cork Butterflies: “Helping Butterflies!”','lp12','cork',[['What to teach',['Butterflies help flowers grow by carrying pollen','They need clean gardens and safe places to live','Reusing natural materials (like corks) reduces waste']],['Teaching script',['“Butterflies help plants grow.”','“We need to keep their homes clean.”','“Today we will reuse corks to make butterflies.”']],['Activity steps',['Show pictures of butterflies and flowers','Ask: “What do butterflies need to live?”','Create the butterfly (steps below)','End with: “How can we help real butterflies?”']]]],
['l-zebra','Toilet-Roll Zebra: “Paper Saves Animal Homes!”','lp12','tpanimal',[['What to teach',['Zebras live in grasslands','Paper comes from trees','Recycling paper helps save trees and animal homes','Toilet rolls can be reused for crafts']],['Teaching script',['“Trees are important for animals.”','“Recycling paper means fewer trees are cut down.”','“Today we will reuse a toilet roll to make a zebra.”']],['Activity steps',['Show a picture of a zebra’s habitat','Ask: “What would happen if the grasslands disappeared?”','Make the craft (steps below)','End with: “What paper things can we recycle at home?”']]]],
['l-frog','Cardboard-Tube Frog: “Clean Water for Frogs!”','lp12','frog',[['What to teach',['Frogs need clean ponds to live','Rubbish in water hurts frogs','Recycling keeps rubbish out of waterways','Toilet rolls can be reused']],['Teaching script',['“Frogs need clean water.”','“If rubbish goes in the pond, frogs can get sick.”','“Today we will reuse a toilet roll to make a frog.”']],['Activity steps',['Show a picture of a frog in a pond','Ask: “What makes water dirty?”','Create the frog (steps below)','End with: “How can we keep water clean?”']]]],
['l-spoon','Spoon Butterflies: “Reusing to Protect Nature!”','lp12','spoon',[['What to teach',['Nature has many different animals and plants','We need to protect all living things','Reusing materials helps keep nature clean','Wooden spoons can be turned into butterflies']],['Teaching script',['“Nature is full of different animals.”','“We need to keep their homes clean.”','“Today we will reuse spoons to make butterflies.”']],['Activity steps',['Show pictures of insects and gardens','Ask: “Why is nature important?”','Create the craft (steps below)','End with: “What can we reuse instead of throwing away?”']]]],
['l-dragonfly','Peg Dragonflies: “Turning Waste into a Dragonfly Craft”','lp12','dragonfly',[["Lesson plan: Turning Waste into a Dragonfly Craft", ["<b>Duration:</b> 30–40 minutes", "<b>Age group:</b> 4–8 years", "<b>Topic:</b> Waste reduction, reuse and caring for the environment"]], ["1. Learning objectives", ["By the end of the lesson, students will be able to:<ul><li>Explain what waste is and why too much waste can harm the environment.</li><li>Understand the meaning of reuse and how it helps reduce waste.</li><li>Create a dragonfly peg craft using reused and leftover materials.</li><li>Explain how dragonflies depend on a healthy environment to survive.</li></ul>"]], ["2. Materials", ["Wooden clothes pegs", "Scrap paper, old magazines or leftover coloured paper for wings", "Reused cardboard or packaging", "Googly eyes or small paper circles", "Child-safe scissors", "Non-toxic glue", "Markers or leftover paint", "Clean recycled materials collected before the lesson"]], ["3. Lesson sequence", ["<b>5 min: Introduction: What is waste?</b><br>Explain that waste is something people throw away or no longer need. Some materials can be reused instead of being thrown out.<br><i>Ask students:</i><ul><li>What things do we throw away at home or school?</li><li>Could we use old paper for something new?</li><li>What might happen if rubbish ends up in rivers and ponds?</li></ul>", "<b>5 min: Connect waste to dragonflies</b><br>Explain that dragonflies live near freshwater habitats, such as ponds and wetlands. Their young live in water, where they depend on a healthy environment.<br>Rubbish and pollution can harm dragonflies and other wildlife. Reusing materials and disposing of rubbish properly are small ways we can help care for nature.", "<b>5 min: Introduce the craft</b><br>Explain that students will turn leftover materials into a dragonfly instead of using only new craft supplies.<br>Show examples of scrap paper for wings, cardboard decorations and reused packaging. Discuss how giving materials a new purpose helps reduce waste.", "<b>15–20 min: Main activity: Make a recycled dragonfly</b><ol><li>Decorate a wooden peg using leftover paint or markers.</li><li>Draw four wing shapes on scrap paper or old magazines.</li><li>Cut out the wings using child-safe scissors.</li><li>Glue the paper wings onto the peg.</li><li>Add eyes using googly eyes or small paper circles.</li><li>Decorate with leftover paper scraps.</li></ol>Encourage students to use only what they need and save unused scraps for another activity.", "<b>5 min: Reflection and clean-up</b><br>Invite students to share their dragonflies and explain which materials they reused.<br><i>Ask:</i><ul><li>What waste materials did you reuse?</li><li>How did you give these materials a new purpose?</li><li>How can we help keep dragonflies’ habitats clean?</li></ul>"]], ["4. Key concept: Reduce, reuse, recycle", ["<b>Reduce:</b> Use fewer materials and avoid unnecessary waste.", "<b>Reuse:</b> Turn leftover paper and cardboard into dragonfly wings and decorations.", "<b>Recycle:</b> Place suitable leftover materials in the correct recycling bin according to local recycling rules."]]]],
['l-ocean36','Egg Carton Ocean: “Clean Oceans”','lp36','ocean',[['What to teach',['The ocean is home to many animals','Rubbish like plastic can hurt fish and sea creatures','Recycling and reusing helps the ocean','Egg cartons can become coral instead of going in the bin']],['Teaching script',['“Fish need clean water to live.”','“Plastic in the ocean can make animals sick.”','“When we recycle, we stop rubbish going into the ocean.”','“Today we will make coral using old egg cartons to show how recycling helps sea life.”']],['Activity steps',['Show pictures of clean vs polluted oceans','Ask: “What do you see? How do you think the fish feel?”','Create the craft (steps below)','End with: “What can we recycle at home to help the ocean?”']]]],
['l-bouquet','Egg-Carton Flower Bouquet: “Recycling for Beauty”','lp36','bouquet',[['Concepts to teach',['What recycling means and how it reduces landfill waste','How everyday materials (like egg cartons) can be reused','“Upcycling”: turning waste into something useful or beautiful']],['Teaching steps',['Introduce recycling: show recyclable materials and discuss what happens in landfill','Explain upcycling: ask how art can give new life to waste','Create the craft (steps below)','Connect to sustainability: reusing saves energy and resources','Reflection: students write one way to reuse items at home']],['Learning outcome',['Students understand that recycling and upcycling reduce waste and protect the environment']]]],
['l-pflower','Plastic-Bottle Flower: “Transforming Trash into Treasure”','lp36','bflower',[['Concepts to teach',['The environmental impact of plastic pollution','How plastics can be reused creatively','The importance of reducing single-use plastics']],['Teaching steps',['Discuss plastic pollution: show photos of oceans affected by plastic waste','Explain recycling symbols: how to identify recyclable plastics','Create the craft (steps below)','Connect to sustainability: reuse helps wildlife and reduces pollution','Reflection: brainstorm ways to reduce plastic use in daily life']],['Learning outcome',['Students can explain how reusing plastic helps protect ecosystems and reduces waste']]]],

function craftHTML(c){const col=C[c[2]][1];
 if(c[0]==='dragonfly')return `<div style="--c:${col}">${pic(c[0])}<div class="box"><h2>🪷 Dragonfly Peg Craft</h2><p>Simple step-by-step instructions</p><h2>What you will need</h2><ul><li>Wooden clothes pegs</li><li>Child-safe, washable paint and paintbrushes</li><li>Coloured paper or card for the wings</li><li>Child-safe glue</li><li>Crayons or markers for decorating</li></ul><h2>Let's make our dragonfly!</h2><p><b>Step 1: Paint the peg 🎨</b><br>Choose your favourite colour and paint the wooden peg. Leave it to dry.</p><p><b>Step 2: Make the paper wings 🪽</b><br>An adult cuts out four wing shapes from coloured paper. Children can decoratethemwith crayons or dots of paint.</p><p><b>Step 3: Attach the wings</b><br>With an adult's help, glue the paper wings onto the peg. Let the glue dry.</p><p><b>Step 4: Add a face 😊</b><br>Draw two eyes and a little smile on the front of the peg.</p><p><b>Step 5: Let's fly! 🌼</b><br>Hold your dragonfly and pretend it is flying through a garden. Flap your arms like dragonfly wings!</p></div></div>`;

  h+='</p>'+craftHTML(c)}
